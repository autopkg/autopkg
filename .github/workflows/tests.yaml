---
name: Test AutoPkg

on:
  push:
    # https://github.community/t/how-to-trigger-an-action-on-push-or-pull-request-but-not-both/16662
    branches:
      - master
      - dev
    paths:
      - "**.py"
      - ".github/workflows/requirements.txt"
      - ".github/workflows/tests.yaml"
      - "Code/tests/Test-Recipes/AutopkgCore.test.recipe.yaml"
  pull_request:
    branches:
      - dev*
    paths:
      - "**.py"
      - ".github/workflows/requirements.txt"
      - ".github/workflows/tests.yaml"
      - "Code/tests/Test-Recipes/AutopkgCore.test.recipe.yaml"

jobs:
  unittests:
    strategy:
      fail-fast: false
      matrix:
        # https://ncorti.com/blog/howto-github-actions-build-matrix
        # ubuntu-latest, macos-latest, windows-latest
        os: [macos-latest, windows-latest, ubuntu-latest]
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    runs-on: ${{ matrix.os }}
    steps:
      # only needed on self hosted windows runners:
      #   This has no effect on GitHub hosted Windows runners
      - name: Set powershell execution policy CurrentUser
        if: runner.os == 'Windows'
        shell: cmd
        run: powershell -command "Set-ExecutionPolicy -Force -ExecutionPolicy RemoteSigned -Scope CurrentUser"

      - name: Checkout repo
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}

      - name: Set token
        # required for githubreleaseinfoprovider in github actions
        # without this, API limits will be hit
        run: |
          cd ~
          echo ${{ secrets.GITHUB_TOKEN }} > ".autopkg_gh_token"

      - name: Install requirements
        run: pip install --requirement .github/workflows/requirements.txt

      - name: Create empty autopkg config file - Windows
        # https://stackoverflow.com/questions/57946173/github-actions-run-step-on-specific-os
        if: runner.os == 'Windows'
        shell: cmd
        run: |
          if not exist "%USERPROFILE%/AppData/Local/Autopkg" mkdir "%USERPROFILE%/AppData/Local/Autopkg"
          if not exist "%USERPROFILE%/AppData/Local/Autopkg/config.json" echo {} > "%USERPROFILE%/AppData/Local/Autopkg/config.json"

      - name: Create empty autopkg config file - Linux
        if: runner.os == 'Linux'
        run: |
          cd ~ && mkdir -p .config/Autopkg
          cd ~ && echo {} > .config/Autopkg/config.json

      - name: Run unittests
        run: python Scripts/run_tests.py

      - name: Run e2e tests
        # A deliberate cross-platform subset of Code/tests/e2e_tests.sh, which
        # is macOS-only and can't run here. Verbs intentionally NOT run:
        #   install                   - needs root
        #   search                    - GitHub API rate limits
        #   run, clear-cache          - need network and a populated cache
        #   help, generate-recipe-map - covered by the unit tests
        # Adding a verb to e2e_tests.sh does not add it here. If it works
        # cross-platform without root or network, add it below as well.
        # e2e tests that hit the github apis will not work due to api limits unless it properly uses ".autopkg_gh_token"
        shell: bash
        run: |
          echo "**List-processors:"
          python Code/autopkg list-processors
          echo "**Processor-info:"
          python Code/autopkg processor-info URLDownloader
          echo "**Repo-add:"
          python Code/autopkg repo-add recipes
          echo "**Repo-list:"
          python Code/autopkg repo-list
          echo "**Repo-update:"
          python Code/autopkg repo-update all
          echo "**Audit:"
          python Code/autopkg audit Firefox.munki
          echo "**Info:"
          python Code/autopkg info Firefox.munki
          echo "**List-recipes:"
          python Code/autopkg list-recipes
          echo "**Make-override:"
          python Code/autopkg make-override Firefox.munki --force
          echo "**New-recipe:"
          python Code/autopkg new-recipe TestRecipe.check
          echo "**Verify-trust-info:"
          python Code/autopkg verify-trust-info Firefox.munki
          echo "**Update-trust-info:"
          python Code/autopkg update-trust-info Firefox.munki
          echo "**Version:"
          python Code/autopkg version
          echo "**Repo-delete:"
          python Code/autopkg repo-delete recipes

      - name: Run integration recipe
        # using recipe path to NOT rely on prefs or current working directory
        run: python Code/autopkg run -vv Code/tests/Test-Recipes/AutopkgCore.test.recipe.yaml
