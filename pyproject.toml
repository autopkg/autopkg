[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "autopkg"
description = "Automates software packaging and distribution for Munki, Jamf, Chocolatey and others"
readme = "ReadMe.md"
license = "Apache-2.0"
license-files = ["LICENSE.txt"]
requires-python = ">=3.10"
# Read from Code/autopkglib/version.plist by setup.py.
dynamic = ["version"]
# Runtime sections of requirements.in, unpinned. Keep the two in sync.
dependencies = [
    "appdirs",
    "certifi",
    "lxml",
    "pyyaml",
    # pkg_resources is imported by MLBZ521-recipes and n8felton-recipes and was
    # removed in setuptools 82. Drop the cap once those recipes stop using it.
    "setuptools<82",
    "xattr; sys_platform == 'darwin' or sys_platform == 'linux'",
    "pyobjc-core; sys_platform == 'darwin'",
    "pyobjc-framework-Cocoa; sys_platform == 'darwin'",
    "pyobjc-framework-Quartz; sys_platform == 'darwin'",
    "pyobjc-framework-Security; sys_platform == 'darwin'",
    "pyobjc-framework-SystemConfiguration; sys_platform == 'darwin'",
    "pyobjc-framework-LaunchServices; sys_platform == 'darwin'",
]

[project.urls]
Homepage = "https://github.com/autopkg/autopkg"
Documentation = "https://github.com/autopkg/autopkg/wiki"
Changelog = "https://github.com/autopkg/autopkg/blob/master/CHANGELOG.md"

[tool.setuptools]
package-dir = { "" = "Code" }
# Ship the CLI as a script rather than a console_scripts entry point so it
# can stay at Code/autopkg, where the macOS pkg, install.sh, autopkg.ps1 and
# the tests expect it. Installers rewrite its shebang to the target Python.
# The cost is no autopkg.exe on Windows; run `python <venv>\Scripts\autopkg`.
script-files = ["Code/autopkg"]

[tool.setuptools.packages.find]
where = ["Code"]
include = ["autopkgcmd*", "autopkglib*", "nuget*"]

[tool.setuptools.package-data]
autopkglib = ["version.plist"]
